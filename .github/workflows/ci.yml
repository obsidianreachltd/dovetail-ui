name: CI

on:
  pull_request:
  push:
    branches: [main]

# The Rust version is pinned in rust-toolchain.toml. Keep the versions below
# the same as it, so new lints and compiler messages arrive only when it is
# upgraded on purpose.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace --exclude dovetail-macros
      - name: New project builds (M05)
        run: cargo test -p dovetail-cli --test new_project -- --ignored

  # The compile-fail tests lock rustc's error messages, which change between
  # Rust versions, so they run on one system, with the pinned version.
  # When the version is upgraded, regenerate the .stderr files
  # (crates/dovetail-macros/tests/compile_fail.rs).
  macro-errors:
    name: macro error messages (Rust 1.100.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Test dovetail-macros
        run: cargo test -p dovetail-macros

  window-self-test:
    # Opens real windows and draws with the GPU (M01), and runs the GPU
    # painting tests (M04). It blocks on all three systems: it first passed
    # on Linux and macOS on 2026-11-25.
    name: window self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      # winit loads the X11 and keyboard libraries when it starts, so they
      # must be installed even though nothing links against them.
      # Openbox is a small window manager: without one, X11 windows cannot
      # be maximised or made full screen (M19).
      - name: Install a display server, X11 libraries and software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb openbox mesa-vulkan-drivers libvulkan1
          libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
      - name: Build
        run: cargo build -p example-window -p example-counter -p example-motion -p example-multi-window
      # A self-test that hangs is stopped by the step's time limit. The
      # `timeout` command is not on macOS runners.
      - name: Counter self-test (M04)
        timeout-minutes: 3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN cargo run -p example-counter -- --self-test
      # Includes building the tests, and the sharpness test, which takes
      # about two minutes in a debug build.
      - name: GPU tests (painting and device loss)
        timeout-minutes: 12
        shell: bash
        run: |
          # On Linux the tests run one at a time: lavapipe has crashed with
          # signal 11 when tests made their own devices at the same time (B0007).
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; ONE="--test-threads=1"; else RUN=""; ONE=""; fi
          $RUN cargo test -p dovetail-render --all-features -- --ignored $ONE
          # Pictures compared with saved ones (M20).
          $RUN cargo test -p dovetail-testing --features pictures -- --ignored $ONE
      # If they still fail on Linux, run each GPU test binary again under gdb,
      # to show which test crashed and where (B0007).
      - name: Backtrace of a GPU test crash (Linux)
        if: failure() && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get install -y gdb
          lscpu | grep -E 'Model name|Flags' | cut -c1-300
          dpkg -l mesa-vulkan-drivers | tail -1
          for bin in $(cargo test -p dovetail-render --all-features --tests --no-run --message-format=json | jq -r 'select(.executable != null) | .executable'); do
            echo "::group::$(basename "$bin")"
            xvfb-run -a gdb -batch -ex run -ex 'thread apply all bt 30' --args "$bin" --ignored
            echo "::endgroup::"
          done
      # Tests with real windows, run from `cargo test` on the main thread
      # with the event loop pumped a step at a time (M20, D0026). They
      # replace the prototype's run.
      - name: Window tests (M20)
        timeout-minutes: 5
        shell: bash
        run: |
          # With a window manager on Linux, which maximising needs (M19).
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a sh -c 'openbox & sleep 1; cargo test -p dovetail-testing --features windows --test windows -- --ignored'
          else
            cargo test -p dovetail-testing --features windows --test windows -- --ignored
          fi
      # Each system setting set from inside the program, an animation's
      # end, and no frames while nothing moves (M18).
      - name: Motion self-test (M18)
        timeout-minutes: 3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN cargo run -p example-motion -- --self-test
      # Several windows closed and opened again in their places, a modal
      # window, full screen, and the exit policy (M19).
      - name: Multi-window self-test (M19)
        timeout-minutes: 3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a sh -c 'openbox & sleep 1; cargo run -p example-multi-window -- --self-test'
          else
            cargo run -p example-multi-window -- --self-test
          fi
      - name: Window self-test (M01)
        timeout-minutes: 3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN cargo run -p example-window -- --self-test
