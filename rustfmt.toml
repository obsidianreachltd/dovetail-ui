# --- Core style ---
edition = "2024"
style_edition = "2024"
max_width = 80
hard_tabs = false
tab_spaces = 2

# --- Line breaking ---
use_small_heuristics = "Off"
fn_call_width = 60
attr_fn_like_width = 60
struct_lit_width = 40
struct_variant_width = 40
array_width = 40
chain_width = 50
single_line_if_else_max_width = 50

# --- Function formatting ---
fn_params_layout = "Vertical"
# --- Match / control flow ---
match_block_trailing_comma = true

# --- Misc ---
newline_style = "Unix"
